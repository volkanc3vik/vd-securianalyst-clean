<!DOCTYPE html><html lang="en"><head><link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png"><link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#0a0e17"><meta property="og:image" content="https://vd-securianalyst.com/assets/brand/og-image.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VD SecuriAnalyst — Elite Intelligence Center</title>
<link rel="stylesheet" href="../shared/nav/nav.css">
<style>
:root{--bg:#0a0e17;--card:#111722;--bd:#1e2836;--tx:#e6edf6;--mut:#8b98ac;--ac:#3b9eff;--ok:#36d399;--bad:#f87272;--warn:#fbbd23;--elite:#b39dfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h2{font-size:13px;color:var(--mut);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.full{grid-column:1/-1}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.k{color:var(--mut)}.v{font-weight:600}
.bar{position:relative;height:20px;background:#1a2330;border-radius:7px;overflow:hidden;margin:12px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--elite))}
.barlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px}
.badge-lg{font-size:13px;padding:8px 18px}
.badge-req{background:rgba(251,189,35,.14);color:var(--warn);border:1px solid rgba(251,189,35,.5)}
.badge-active{background:rgba(54,211,153,.12);color:var(--ok);border:1px solid rgba(54,211,153,.45)}
.badge-admin{background:rgba(157,125,250,.15);color:var(--elite);border:1px solid rgba(157,125,250,.45)}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--elite));color:#04101f}
.btn-sm{padding:7px 14px;font-size:13px}
.reqbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(251,189,35,.06);border:1px solid rgba(251,189,35,.35);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.reqbar .btn{background:linear-gradient(90deg,var(--warn),var(--elite));margin-left:auto}
.sell{background:#0e1622;border:1px solid var(--bd);border-left:3px solid var(--elite);border-radius:12px;padding:16px 18px;margin-bottom:16px;font-size:14px;line-height:1.6}
.sell b{color:var(--elite)}.sell ul{margin:10px 0 0;padding-left:18px}.sell li{margin:4px 0}
.lockcard .card{border-left:3px solid rgba(157,125,250,.5)}
.openable .card{border-left:3px solid rgba(54,211,153,.45)}
.collecting{color:var(--mut);font-size:13px;font-style:italic;margin:0}
.cstat{margin-top:10px;font-size:11px;color:var(--mut);border-top:1px solid var(--bd);padding-top:8px}.cstat span{font-weight:600}
.cstat .s-collect{color:var(--ok)}.cstat .s-lock{color:var(--warn)}.cstat .s-active{color:var(--elite)}
.flagship{border:1px solid rgba(157,125,250,.5);background:linear-gradient(180deg,rgba(157,125,250,.08),transparent);border-radius:16px;padding:24px;margin-bottom:16px}
.flagship h2{font-size:15px;color:var(--elite);margin:0 0 6px}.flagship .fd{color:var(--mut);font-size:14px;margin:0}.flagship .ftag{display:inline-block;font-size:10px;color:var(--elite);border:1px solid rgba(157,125,250,.4);border-radius:6px;padding:2px 8px;margin-top:12px}
.cta{text-align:center;border:1px solid rgba(157,125,250,.4);background:rgba(157,125,250,.06);border-radius:14px;padding:20px 16px;margin-top:6px}
.cta .ttl{font-size:16px;font-weight:700;margin:6px 0 4px;color:var(--elite)}.cta .tx{color:var(--mut);font-size:13px;margin-bottom:14px}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.disc{color:var(--mut);font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:16px;border-left:3px solid var(--warn)}
.ehead{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:linear-gradient(180deg,rgba(157,125,250,.09),transparent);border:1px solid var(--bd);border-left:3px solid var(--elite);border-radius:12px;padding:13px 18px;margin-bottom:16px}
.ehead .hm{display:flex;flex-direction:column}
.ehead .hm b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.ehead .hm span{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.ehead .asof{margin-left:auto;color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.epair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.epanel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.epanel-h{font-size:12px;color:var(--tx);font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.epanel-h::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--elite);box-shadow:0 0 8px var(--elite)}
.epanel-sub{color:var(--mut);font-size:11px;margin:5px 0 12px;line-height:1.45}
.erow{padding:10px 0;border-bottom:1px solid var(--bd)}.erow:last-child{border:0}
.erow-top{display:flex;align-items:center;gap:9px}
.erank{font-size:11px;font-weight:800;color:var(--elite);min-width:20px;font-variant-numeric:tabular-nums}
.elabel{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.epct{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:800}
.epct.hi{color:var(--ok)}.epct.mid{color:var(--warn)}.epct.lo{color:var(--bad)}
.ebar{height:5px;background:#1a2330;border-radius:4px;overflow:hidden;margin:6px 0 4px}
.ebar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--elite));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.erow-bot{display:flex;justify-content:space-between;align-items:center}
.en{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.econf{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px}
.econf.h{background:rgba(54,211,153,.12);color:var(--ok);border:1px solid rgba(54,211,153,.4)}
.econf.m{background:rgba(59,158,255,.12);color:var(--ac);border:1px solid rgba(59,158,255,.4)}
.econf.l{background:rgba(251,189,35,.1);color:var(--warn);border:1px solid rgba(251,189,35,.35);opacity:.9}
.emicro{color:var(--mut);font-size:10px;margin-top:11px;font-style:italic;border-top:1px solid var(--bd);padding-top:8px}
.coming .card{opacity:.72}
.coming h2 .tag{float:right;font-size:8.5px;color:var(--elite);border:1px solid rgba(157,125,250,.4);border-radius:5px;padding:1px 6px;letter-spacing:.03em}
@media(max-width:680px){.epair{grid-template-columns:1fr}}
.csub{color:var(--mut);font-size:10.5px;margin:-4px 0 10px;line-height:1.4}
.mrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.mrow:last-child{border:0}
.mlabel{font-size:12px;font-weight:600;color:var(--tx)}
.mpct{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:800;text-align:right}
.mpct.hi{color:var(--ok)}.mpct.mid{color:var(--warn)}.mpct.lo{color:var(--bad)}
.mbar{grid-column:1/-1;height:4px;background:#1a2330;border-radius:3px;overflow:hidden;margin-top:1px}
.mbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--elite));transition:width .7s ease}
.mn{grid-column:1/-1;font-size:9.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.watch{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.watch-h{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
.wchip{display:inline-block;font-size:10.5px;color:var(--mut);background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;margin:0 5px 5px 0;font-variant-numeric:tabular-nums}
.wchip b{color:var(--tx)}
.mx{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mx-row{display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:4px}
.mx-cell{font-size:10px;padding:5px 4px;border-radius:5px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:30px}
.mx-head .mx-h{color:var(--mut);font-size:9px;text-transform:uppercase;letter-spacing:.03em}
.mx-corner{background:transparent}
.mx-b{color:var(--tx);font-weight:600;font-size:10px;justify-content:center;align-items:flex-start;text-align:left}
.mx-v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-weight:800;font-size:12px;border:1px solid var(--bd)}
.mx-v i{font-style:normal;font-size:8px;color:var(--mut);font-weight:600;margin-top:1px}
.mx-v.hi{background:rgba(54,211,153,.13);color:var(--ok)}
.mx-v.mid{background:rgba(251,189,35,.12);color:var(--warn)}
.mx-v.lo{background:rgba(248,114,114,.12);color:var(--bad)}
.mx-v.mx-low{opacity:.5}
.mx-empty{color:var(--mut);opacity:.4}

/* ===== Build 122 — Bloomberg terminal reset (mor→cyan, glow azalt) ===== */
:root{--cyan:#38bdf8}
.bar>i,.ebar>i,.mbar>i{background:linear-gradient(90deg,var(--ac),var(--cyan))}
.btn{background:linear-gradient(90deg,var(--ac),var(--cyan))}
.reqbar .btn{background:linear-gradient(90deg,var(--warn),var(--ac))}
.epanel-h::before{background:var(--ac);box-shadow:none}
.erank{color:var(--ac)}
.ehead{background:rgba(56,189,248,.05);border-left-color:var(--ac)}
.cta{border-color:rgba(56,189,248,.35);background:rgba(56,189,248,.05)}
.cta .ttl{color:var(--ac)}
.flagship{border-color:rgba(56,189,248,.28);background:linear-gradient(180deg,rgba(56,189,248,.05),transparent)}
.flagship h2{color:var(--tx)}
.sell{border-left-color:var(--ac)}.sell b{color:var(--ac)}
.lockcard .card{border-left-color:rgba(59,158,255,.45)}
.coming h2 .tag,.card h2 .tag{color:var(--ac);border-color:rgba(59,158,255,.4)}
.cstat .s-active{color:var(--ac)}
.elead{font-size:14px;color:var(--tx);font-weight:600;margin:0 0 12px;line-height:1.5}
.elead b{color:var(--cyan);font-variant-numeric:tabular-nums}
.ethresh{font-size:11px;color:var(--mut);margin:-6px 0 18px;font-variant-numeric:tabular-nums;border-left:2px solid var(--bd);padding-left:10px}
.ethresh b{color:var(--tx)}
.ehead .hm-bd b{font-size:15px}
.asof{display:flex;flex-direction:column;margin-left:auto;text-align:right;gap:2px}
.asof span{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.asof b{font-size:12px;color:var(--tx);font-variant-numeric:tabular-nums}
.erow-hd{display:flex;align-items:center;gap:9px;padding:0 0 8px;border-bottom:1px solid var(--bd);margin-bottom:2px}
.erow-hd span{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.erow-hd .h-rank{min-width:20px}.erow-hd .h-lbl{flex:1}.erow-hd .h-pct{font-variant-numeric:tabular-nums}
.flag-h{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.flag-h h2{margin:0;font-size:15px;color:var(--tx)}
.flag-badge{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--elite);border:1px solid rgba(157,125,250,.5);background:rgba(157,125,250,.1);border-radius:5px;padding:2px 7px}
.ai-obs{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ai-obs li{font-size:12.5px;line-height:1.5;color:var(--tx);background:rgba(255,255,255,.02);border:1px solid var(--bd);border-left:2px solid var(--ac);border-radius:8px;padding:9px 12px}
.ai-sum{color:var(--mut);font-size:12.5px;margin:0}
</style></head><body>
<header class="aic-header">
  <a href="index.html" onclick="if(window.vdGoDashboard){vdGoDashboard();return false}" class="aic-logo">◈ VD <b>SecuriAnalyst</b></a>
  <nav class="aic-nav"><a href="index.html" onclick="if(window.vdGoDashboard){vdGoDashboard();return false}" class="aic-home-btn">← Back to Dashboard</a></nav>
</header>
<h1>🧠 Elite Intelligence Center</h1>
<p class="sub">A high-level market intelligence layer derived from archive and AI Learning data. <span id="gen"></span></p>
<div class="disc">⚠️ The content here consists of statistical observations derived from past results; it is not investment advice.</div>
<div id="app"><p class="sub">Loading…</p></div>

<script src="../modules/access-levels.js"></script>
<script>
(function(){
  const TARGET = 50;
  const app = document.getElementById('app');
  function level(){ try { return (window.VDAccess && window.VDAccess.level) ? window.VDAccess.level() : 'free'; } catch(e){ return 'free'; } }
  function isElite(){ try { return !!(window.VDAccess && window.VDAccess.isElite && window.VDAccess.isElite()); } catch(e){ return false; } }

  function accessBadge(lvl){
    if (lvl === 'admin') return '<span class="badge badge-admin">🛡 Elite Admin Access</span>';
    if (lvl === 'elite') return '<span class="badge badge-active">🟢 Elite Access Active</span>';
    return '<span class="badge badge-req">🔒 Elite Access Required</span>';
  }

  function progressBox(lvl, count){
    const rate = Math.min(100, Math.round((count / TARGET) * 100));
    const status = count >= TARGET ? 'Active' : 'Collecting Market Intelligence';
    return `
      <div class="card full">
        <h2>Elite Activation Progress</h2>
        ${accessBadge(lvl)}
        <div class="row" style="margin-top:14px"><span class="k">Validated Records</span><span class="v">${count} / ${TARGET}</span></div>
        <div class="bar"><i style="width:${rate}%"></i><span class="barlabel">${count} / ${TARGET} Outcomes</span></div>
        <div class="row"><span class="k">Learning Progress</span><span class="v">${rate}%</span></div>
        <div class="row"><span class="k">Activation Threshold</span><span class="v">50 Validated Outcomes</span></div>
        <div class="row"><span class="k">Status</span><span class="v">${status}</span></div>
      </div>`;
  }

  const FEATURES = ['Elite Coin Ranking','Elite Structure Ranking','Elite Market Conditions','Elite Volatility Intelligence','Elite Regime Intelligence','Elite Opportunity Matrix'];

  // ── Kart durumu: erişim + veri eşiğine göre ikon/metin (otomatik açılır) ──
  //   premium (erişim yok)      → 🔒  + "Unlocks with Elite Pass"
  //   elite/admin + veri<50     → 🟢  + "Collecting Data"
  //   elite/admin + veri>=50    → 🔓  + "Active"  (eşik aşılınca KENDİLİĞİNDEN)
  function cardState(hasAccess, dataReady){
    if (!hasAccess) return { icon:'🔒', cls:'lockcard', msg:'Unlocks with Elite Pass.', statTxt:'Locked', statCls:'s-lock' };
    if (!dataReady) return { icon:'🟢', cls:'lockcard', msg:'Market Intelligence data is being collected. Elite metrics will activate after sufficient validated outcomes.', statTxt:'Collecting Data', statCls:'s-collect' };
    return { icon:'🔓', cls:'openable', msg:'Activated — Elite metrics ready.', statTxt:'Active', statCls:'s-active' };
  }
  function featureCards(st){
    return `<div class="grid ${st.cls}">` + FEATURES.map(name =>
      `<div class="card"><h2>${st.icon} ${name}</h2><p class="collecting">${st.msg}</p><div class="cstat">Status: <span class="${st.statCls}">${st.statTxt}</span></div></div>`
    ).join('') + `</div>`;
  }
  function flagshipReports(st){
    return `<div class="flagship">
      <h2>${st.icon} AI Intelligence Reports</h2>
      <p class="fd">${st.msg}</p>
      <span class="ftag">Strongest part of Elite · Phase 13.1 in preparation</span>
      <div class="cstat" style="margin-top:14px">Status: <span class="${st.statCls}">${st.statTxt}</span></div>
    </div>`;
  }

  function renderFree(){
    app.innerHTML = `
      <div class="cta">
        <div style="font-size:30px">🔒</div>
        <div class="ttl">Elite Access Required</div>
        <div class="tx">The Elite Intelligence Center is available to Elite members.</div>
        <a class="btn" href="legal/premium.html">Get Elite Pass →</a>
      </div>`;
  }

  function renderPremium(count){
    const dataReady = count >= TARGET;
    const st = cardState(false, dataReady); // premium: erişim yok → 🔒
    app.innerHTML =
      `<div class="reqbar"><span class="badge badge-req badge-lg">🔒 Elite Access Required</span><a class="btn btn-sm" href="legal/premium.html">Get Elite Pass →</a></div>` +
      `<div class="grid">${progressBox('premium', count)}</div>` +
      `<div class="sell">
        <b>Elite Intelligence Layer</b>, a high-level analysis layer that activates when AI Learning and Archive results reach sufficient data levels.
        <br><br><b>Elite Pass</b> unlocks the following:
        <ul><li>Coin-based observed consistency</li><li>Structure-based observed consistency</li><li>Market condition intelligence</li><li>Opportunity Matrix</li><li>Elite AI Reports</li></ul>
      </div>` +
      featureCards(st) + flagshipReports(st) +
      `<p class="note">Elite Intelligence Engine is currently learning from validated outcomes.</p>`;
  }

  // ── ELITE MVP: Gözlemlenen Tutarlılık (Learning Confidence) ──────────────
  // Çerçeve: coin/yapı TAVSİYESİ DEĞİL → AI'nın geçmiş doğrulanmış kayıtlardaki
  // gözlemlenen tutarlılığı. Veri: /api/archive-stats (byCoin / byStructure).
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function rateOf(it){ const t=it.total||((it.success||0)+(it.partial||0)+(it.fail||0)); return t?Math.round(((it.success||0)+(it.partial||0)*0.5)/t*100):0; }
  function confOf(rate,n){ if(n>=10&&rate>=75)return{c:'h',t:'High Confidence'}; if(n>=5)return{c:'m',t:'Medium Confidence'}; return{c:'l',t:'Low Sample'}; }
  function pctCls(r){ return r>=75?'hi':r>=60?'mid':'lo'; }
  function scoreOf(it){ const r=rateOf(it), n=it.total||0; return r*Math.min(1,n/10); } // örneklem-ağırlıklı (fluke üste çıkmasın)
  function rankItems(items){
    return (items||[]).slice().filter(it=>it&&(it.total||0)>0)
      .sort((a,b)=>{ const a5=(a.total||0)>=5?1:0,b5=(b.total||0)>=5?1:0; if(a5!==b5)return b5-a5; return scoreOf(b)-scoreOf(a)||(b.total||0)-(a.total||0); })
      .slice(0,5);
  }
  function consistencyPanel(title, sub, items, emptyMsg, extra){
    const top=rankItems(items);
    const hdr = top.length ? `<div class="erow-hd"><span class="h-rank">#</span><span class="h-lbl">Pair / Structure · Observed Consistency</span><span class="h-pct">%</span></div>` : '';
    const body = top.length ? top.map((it,i)=>{
      const r=rateOf(it), n=it.total||0, cf=confOf(r,n);
      return `<div class="erow">
        <div class="erow-top"><span class="erank">#${i+1}</span><span class="elabel">${esc(it.key)}</span><span class="epct ${pctCls(r)}">%${r}</span></div>
        <div class="ebar"><i data-w="${r}"></i></div>
        <div class="erow-bot"><span class="en">${n} observations</span><span class="econf ${cf.c}">${cf.t}</span></div>
      </div>`;
    }).join('') : `<p class="collecting">${emptyMsg||'Not enough observations yet.'}</p>`;
    return `<div class="epanel"><div class="epanel-h">${title}</div><div class="epanel-sub">${sub}</div>${hdr}${body}${extra||''}
      <div class="emicro">Observation derived from past validated records · not investment advice.</div></div>`;
  }

  // Kompakt mini-panel (risk/güven gibi az satırlı koşullar için)
  function miniRows(items){
    const list=(items||[]).filter(it=>(it.total||0)>0).sort((a,b)=>scoreOf(b)-scoreOf(a));
    if(!list.length) return `<p class="collecting">Collecting data…</p>`;
    return list.map(it=>{
      const r=rateOf(it), n=it.total||0;
      return `<div class="mrow"><span class="mlabel">${esc(it.key)}</span><span class="mpct ${pctCls(r)}">%${r}</span><div class="mbar"><i data-w="${r}"></i></div><span class="mn">${n} observations</span></div>`;
    }).join('');
  }
  // Coin paneli boşken: düşük örneklemli (henüz <5) coinleri "izlemede" olarak soluk göster
  function watchList(items){
    const low=(items||[]).filter(it=>(it.total||0)>0 && (it.total||0)<5).sort((a,b)=>rateOf(b)-rateOf(a)||(b.total||0)-(a.total||0)).slice(0,6);
    if(!low.length) return '';
    return `<div class="watch"><div class="watch-h">Watching · low sample (not ≥5 observations yet)</div>`+
      low.map(it=>`<span class="wchip">${esc(it.key)} <b>%${rateOf(it)}</b> · ${it.total}</span>`).join('')+`</div>`;
  }
  function conditionsGrid(d){
    const dmicro = `<div class="emicro">Observation derived from validated data; not investment advice.</div>`;
    const real = (title, sub, items) => `<div class="card"><h2>${title}</h2><p class="csub">${sub}</p>${miniRows(items)}${dmicro}</div>`;
    const soon = (title) => `<div class="card"><h2>${title}<span class="tag">PHASE 13.1</span></h2><p class="collecting">Phase 13.1 in preparation — the data model is accumulating.</p><div class="cstat">Status: <span class="s-collect">Phase 13.1 in preparation</span></div></div>`;
    const matrix = () => {
      const rows = (d.opportunityMatrix||[]).filter(r => r.cells && r.cells.some(c=>c.total>0));
      if(!rows.length) return soon('ELITE OPPORTUNITY MATRIX');
      const risks = ['Low Risk','Medium Risk','High Risk'];
      const head = `<div class="mx-row mx-head"><span class="mx-cell mx-corner"></span>`+risks.map(r=>`<span class="mx-cell mx-h">${r.replace(' Risk','')}</span>`).join('')+`</div>`;
      const body = rows.map(r=>{
        const cells = r.cells.map(c=>{
          if(!c.total) return `<span class="mx-cell mx-empty">–</span>`;
          const rr=Math.round(c.rate), cls=rr>=75?'hi':rr>=60?'mid':'lo', lo=c.lowSample?' mx-low':'';
          return `<span class="mx-cell mx-v ${cls}${lo}" title="${c.total} observations">%${rr}<i>${c.total}</i></span>`;
        }).join('');
        return `<div class="mx-row"><span class="mx-cell mx-b">${esc(r.label)}</span>${cells}</div>`;
      }).join('');
      return `<div class="card"><h2>ELITE OPPORTUNITY MATRIX</h2><p class="csub">Consistency observed under direction × risk conditions (%consistency · observations). Low sample is shown faded.</p><div class="mx">${head}${body}</div>${dmicro}</div>`;
    };
    return `<div class="grid">`+
      real('ELITE MARKET CONDITIONS','Consistency observed by AI confidence level (calibration).', d.byConfidence)+
      real('ELITE VOLATILITY INTELLIGENCE','Consistency observed by risk level.', d.byRisk)+
      soon('ELITE REGIME INTELLIGENCE')+
      matrix()+
      `</div>`;
  }
  function aiReports(d){
    const L=(d&&d.learning)||{}; const o=(d&&d.overall)||{}; const rate=rateOf(o); const cnt=(o.success||0)+(o.partial||0);
    const obs=(L.observations||[]).slice(0,3);
    const body = obs.length
      ? `<ul class="ai-obs">${obs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`
      : `<p class="ai-sum">${esc(L.obsNote||'Observation summaries will be generated automatically as validated analyses accumulate.')}</p>`;
    return `<div class="flagship">
      <div class="flag-h"><span class="flag-badge">ELITE</span><h2>AI Intelligence Reports</h2></div>
      <p class="fd">${cnt} automated learning summary derived from validated results · overall consistency %${rate}.</p>
      ${body}
      <div class="emicro">Statistical observation derived from past validated data; not investment advice.</div>
    </div>`;
  }
  function eheadStrip(d){
    const o=d.overall||{}; const total=o.total||0; const rate=rateOf(o); const cnt=(o.success||0)+(o.partial||0);
    const succ=o.success||0, part=o.partial||0, fail=o.fail||0;
    let asof=''; try{ asof=new Date(d.generated_at||Date.now()).toLocaleString('tr-TR'); }catch(e){}
    return `<p class="elead"><b>${cnt}</b> derived from validated results · Overall consistency <b>%${rate}</b> · Last update ${esc(asof)}</p>
    <div class="ehead">
      <div class="hm"><b>${cnt}</b><span>Validated result</span></div>
      <div class="hm"><b>%${rate}</b><span>Overall consistency</span></div>
      <div class="hm"><b>${total}</b><span>Total analyses</span></div>
      <div class="hm hm-bd"><b>${succ}/${part}/${fail}</b><span>Correct / Partial / Misleading</span></div>
      <div class="asof"><span>Last update</span><b>${esc(asof)}</b></div>
    </div>
    <div class="ethresh">Learning threshold: <b>20 observations</b> · Ranking threshold: <b>5 observations</b> · Consistency = validated + ½ partial (weighted)</div>`;
  }
  function comingNext(){
    const mods=['Elite Market Conditions','Elite Volatility Intelligence','Elite Regime Intelligence','Elite Opportunity Matrix'];
    const cards=mods.map(m=>`<div class="card"><h2>${m}<span class="tag">PHASE 13.1+</span></h2><p class="collecting">Phase 13.1 in preparation — the data model is accumulating.</p><div class="cstat">Status: <span class="s-collect">In preparation</span></div></div>`).join('');
    return `<div class="grid coming">${cards}</div>
      <div class="flagship"><h2>🔓 AI Intelligence Reports</h2><p class="fd">A high-level research layer combining coin and structure consistency.</p><span class="ftag">Strongest part of Elite · Phase 13.1 in preparation</span></div>`;
  }

  function renderElite(lvl, d, count){
    d = d || {};
    const coinItems   = (d.byCoinStrong && d.byCoinStrong.length)      ? d.byCoinStrong      : (d.byCoin||[]).filter(x=>(x.total||0)>=5);
    const structItems = (d.byStructureStrong && d.byStructureStrong.length) ? d.byStructureStrong : (d.byStructure||[]).filter(x=>(x.total||0)>=5);
    const coin = consistencyPanel(
      'OBSERVED CONSISTENCY — COIN-BASED',
      'Observed consistency in these coins across AI past validated analyses (Learning Confidence). Not a coin recommendation.',
      coinItems,
      'Not enough sample (≥5 observations) has accumulated for the coin-based view yet. The structure side is ready; coins will fill in as data grows.',
      watchList(d.byCoin));
    const struct = consistencyPanel(
      'OBSERVED CONSISTENCY — STRUCTURE-BASED',
      'An observation of which analysis structures were validated more consistently in the past (Observed Consistency).',
      structItems,
      'Not enough sample (≥5 observations) has accumulated for the structure-based view yet.');
    app.innerHTML =
      `<div class="grid">${progressBox(lvl, count)}</div>` +
      eheadStrip(d) +
      `<div class="epair">${coin}${struct}</div>` +
      conditionsGrid(d) +
      aiReports(d) +
      `<p class="note">Elite Intelligence consists of statistical observations derived from reviewed past results; not investment advice.</p>`;
    requestAnimationFrame(()=>{ try{ document.querySelectorAll('.ebar>i[data-w],.mbar>i[data-w]').forEach(i=>{ i.style.width=i.getAttribute('data-w')+'%'; }); }catch(e){} });
  }

  function boot(){
    const lvl = level();
    if (lvl === 'free') { renderFree(); return; }
    const elite = isElite();

// ── EN: API'den gelen bilinen Türkçe metinleri çevir (yalnız görüntü; mantık anahtarsız) ──
function trA(o){
  const PH = [
    ['Aşırı Satım Tepkisi + Dönüş Yapısı','Oversold Reaction + Reversal Structure'],
    ['Güçlü Momentum + RSI Genişlemesi','Strong Momentum + RSI Expansion'],
    ['Trend + Momentum Uyumu','Trend + Momentum Alignment'],
    ['Yapısal Denge + Momentum Takibi','Structural Balance + Momentum Tracking'],
    ['Çok Faktörlü Güçlü Yapı','Multi-Factor Strong Structure'],
    ['Çok Faktörlü AI Yapısı','Multi-Factor AI Structure'],
    ['Aşırı Satım Tepkisi','Oversold Reaction'],
    ['Yapısal Denge','Structural Balance'],
    ['Düşük Risk','Low Risk'],['Orta Risk','Medium Risk'],['Yüksek Risk','High Risk'],['Bilinmiyor','Unknown'],
    ['RSI Yüksek (≥65)','RSI High (≥65)'],['RSI Düşük (≤35)','RSI Low (≤35)'],['RSI Orta (35-65)','RSI Mid (35-65)'],
    ['Negatif Funding','Negative Funding'],['Pozitif Funding','Positive Funding'],['Nötr Funding','Neutral Funding'],
    ['Long Baskın','Long-Dominant'],['Short Baskın','Short-Dominant'],['Dengeli','Balanced'],
    ['Yukarı Yönlü','Upside'],['Aşağı Yönlü','Downside'],['Nötr','Neutral'],['Diğer','Other'],
    ['Yeterli beklenti-kayıtlı veri yok (engine paylaşımları biriktikçe dolar).','Not enough expectation-tagged data yet (fills as engine reports accumulate).'],
    ['Yapı kalıcı kolon değil; rsi/score/yön ile türetiliyor. Tam doğruluk için scanner market_context.structure yazmalı.','Structure is not a persisted column; it is derived from rsi/score/direction. For full accuracy the scanner should write market_context.structure.'],
    ['Timeline olay etiketi (timeline_event) YENİ kayıtlardan toplanıyor (Phase 9). Scanner gerçek olay tespitini market_context.timeline_event olarak yayınladıkça dolacak — şu an tespit edilemediğinde null yazılıyor (uydurma yok).','Timeline event tags (timeline_event) are collected from NEW records (Phase 9). They will fill as the scanner publishes real event detections as market_context.timeline_event — currently null is written when nothing is detected (no fabrication).'],
    ['Market koşulu verisi birikiyor (Phase 9 zenginleştirme).','Market condition data is accumulating (Phase 9 enrichment).'],
    ['Funding / Open Interest / Volatilite YENİ kayıtlardan itibaren toplanıyor (Phase 9). Yeterli veri birikince koşul-başarı analizi otomatik açılır. Eski kayıtlarda bu alanlar yok.','Funding / Open Interest / Volatility are collected from NEW records onward (Phase 9). Condition-success analysis opens automatically once enough data accumulates. Older records lack these fields.'],
    ['Open Interest değeri toplanıyor; değişim (open_interest_change) verisi henüz yok — bu kırılım ileride genişletilecek.','Open Interest values are being collected; change data (open_interest_change) is not available yet — this breakdown will be expanded later.'],
  ];
  const RX = [
    [/^Düşük risk \+ 90 üzeri confidence kombinasyonu (\d+) analizde %([\d.,]+) başarı göstermiştir\.$/,'The low-risk + 90+ confidence combination showed %$2 success across $1 analyses.'],
    [/^(.+) yapısı, sistem ortalamasının %([\d.,]+) üzerinde performans göstermektedir \((\d+) örnek\)\.$/,'The $1 structure performs %$2 above the system average ($3 samples).'],
    [/^(.+) volatilite koşulunda, sistem ortalamasının %([\d.,]+) üzerinde uyum göstermiştir \((\d+) örnek\)\.$/,'Under $1 volatility conditions, consistency was %$2 above the system average ($3 samples).'],
    [/^(.+) koşulunda, sistem ortalamasının %([\d.,]+) üzerinde uyum göstermiştir \((\d+) örnek\)\.$/,'Under $1 conditions, consistency was %$2 above the system average ($3 samples).'],
    [/^(.+) rejiminde, sistem ortalamasının %([\d.,]+) üzerinde uyum göstermiştir \((\d+) örnek\)\.$/,'In the $1 regime, consistency was %$2 above the system average ($3 samples).'],
    [/^(.+) dağılımında, sistem ortalamasının %([\d.,]+) üzerinde uyum göstermiştir \((\d+) örnek\)\.$/,'In the $1 distribution, consistency was %$2 above the system average ($3 samples).'],
    [/^(.+) analizleri sistem ortalamasının altında performans göstermektedir \(%([\d.,]+), (\d+) örnek\)\.$/,'$1 analyses perform below the system average (%$2, $3 samples).'],
    [/^Henüz (\d+)\+ örnekli yeterli veri yok — gözlemler doğrulanmış analizler biriktikçe otomatik üretilecek\.$/,'Not enough data with $1+ samples yet — observations will be generated automatically as validated analyses accumulate.'],
  ];
  function trs(v){
    if(typeof v!=='string'||!v) return v;
    let s=v;
    for(const [re,rep] of RX){ if(re.test(s)){ s=s.replace(re,rep); break; } }
    for(const [a,b] of PH){ if(s.indexOf(a)!==-1) s=s.split(a).join(b); }
    return s;
  }
  function walk(x){
    if(Array.isArray(x)) return x.map(walk);
    if(x&&typeof x==='object'){ const o2={}; for(const k in x) o2[k]=walk(x[k]); return o2; }
    return trs(x);
  }
  return walk(o);
}
    fetch('/api/archive-stats').then(r=>r.json()).then(d=>{ d=trA(d);
      let count = 0;
      try { if (d && d.ok && d.overall) count = (d.overall.success||0) + (d.overall.partial||0); } catch(e){}
      try { document.getElementById('gen').textContent = '· ' + new Date(d.generated_at||Date.now()).toLocaleString('tr-TR'); } catch(e){}
      if (elite) renderElite(lvl, d, count); else renderPremium(count);
    }).catch(()=>{ if (elite) renderElite(lvl, {}, 0); else renderPremium(0); });
  }
  let tries=0;
  (function wait(){ if (window.VDAccess || tries++>20) return boot(); setTimeout(wait,80); })();
})();
</script>
