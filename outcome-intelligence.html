<!DOCTYPE html><html lang="tr"><head><link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png"><link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#0a0e17"><meta property="og:image" content="https://vd-securianalyst.com/assets/brand/og-image.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VD SecuriAnalyst — AI Learning</title>
<link rel="stylesheet" href="shared/nav/nav.css">
<style>
:root{--bg:#0a0e17;--card:#111722;--bd:#1e2836;--tx:#e6edf6;--mut:#8b98ac;--ac:#3b9eff;--ok:#36d399;--bad:#f87272;--warn:#fbbd23}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h2{font-size:13px;color:var(--mut);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.k{color:var(--mut)}.v{font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.ins{font-size:11px;color:var(--warn);margin-left:6px}.note{color:var(--mut);font-size:12px;margin-top:8px}.full{grid-column:1/-1}
.obs{background:#0e1622;border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.obs b{color:var(--ac)}.disc{color:var(--mut);font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:16px;border-left:3px solid var(--warn)}
</style></head><body>
<header class="aic-header">
  <a href="index.html" onclick="if(window.vdGoDashboard){vdGoDashboard();return false}" class="aic-logo">◈ VD <b>SecuriAnalyst</b></a>
  <nav class="aic-nav"><a href="index.html" onclick="if(window.vdGoDashboard){vdGoDashboard();return false}" class="aic-home-btn">← Dashboard'a Dön</a></nav>
</header>
<h1>🧠 AI Learning — Outcome Intelligence</h1>
<p class="sub">Sistem, doğrulanmış analiz sonuçlarından öğrenir. <span id="gen"></span></p>
<div class="disc">⚠️ Buradaki gözlemler <b>öneri veya karar değildir</b> — yalnızca geçmiş sonuçlardan türetilmiş istatistiksel gözlemlerdir. Minimum örnek: 20 (altı "Yetersiz Veri").</div>
<div id="app"><p class="sub">Yükleniyor…</p></div>
<script>
const API='/api/archive-stats';
const rate=(g)=>g.insufficient?'<span class="warn">Yetersiz Veri</span>':((g.successRate==null?'—':g.successRate+'%'));
const cls=(x)=>x==null?'':x>=70?'ok':x>=50?'warn':'bad';
function rows(arr,medal){return (arr&&arr.length)?arr.map(g=>`<div class="row"><span class="k">${medal||''}${g.key} ${g.insufficient?'<span class="ins">(n='+g.total+')</span>':'<span class="k" style="font-weight:400">('+g.success+'/'+g.total+')</span>'}</span><span class="v ${g.insufficient?'':cls(g.successRate)}">${rate(g)}</span></div>`).join(''):'<p class="note">Veri yok.</p>';}
// Phase 10: enrichment kırılımları — alan hiç yoksa "Veri Toplanıyor"
const rowsC=(arr)=>(arr&&arr.length)?rows(arr):'<p class="note">Veri Toplanıyor — bu alan yalnızca v76 sonrası kayıtlarda mevcut; yeterli veri birikince otomatik dolar.</p>';
const rep=(o)=>o?`${o.key} <span class="k" style="font-weight:400">(%${o.rate==null?'—':o.rate}, n=${o.n})</span>`:'—';
fetch(API).then(r=>r.json()).then(d=>{
 if(!d.ok){document.getElementById('app').innerHTML='<p class="bad">Hata: '+(d.error||'?')+'</p>';return;}
 document.getElementById('gen').textContent='· '+new Date(d.generated_at).toLocaleString('tr-TR');
 const L=d.learning;
 const obs=L.observations.length?L.observations.map(o=>`<div class="obs">🧠 <b>AI Gözlemi</b><br>${o}</div>`).join(''):`<p class="note">${L.obsNote||''}</p>`;
 const lr=L.learningReport;
 document.getElementById('app').innerHTML=`
 <div class="card full"><h2>🧠 AI Gözlemleri</h2>${obs}</div>
 <div class="grid">
  <div class="card"><h2>Yapı Öğrenmesi</h2>${rows(L.byStructure)}<p class="note">${d.gaps.structure_note}</p></div>
  <div class="card"><h2>Confidence Öğrenmesi</h2>${rows(L.byConfidence)}</div>
  <div class="card"><h2>Risk Öğrenmesi</h2>${rows(L.byRisk)}</div>
 </div>
 <div class="grid">
  <div class="card"><h2>🏆 En Başarılı Coinler</h2>${rows(L.topCoins)}</div>
  <div class="card"><h2>⚠️ En Zayıf Coinler</h2>${rows(L.weakCoins)}</div>
  <div class="card"><h2>Market Koşulu (RSI)</h2>${rows(L.byRsi)}<p class="note">${L.marketConditions.note}</p></div>
 </div>
 <div class="grid">
  <div class="card"><h2>Funding Bazlı Başarı</h2>${rowsC(L.byFunding)}</div>
  <div class="card"><h2>Long / Short Bazlı Başarı</h2>${rowsC(L.byLongShort)}</div>
  <div class="card"><h2>Volatilite Bazlı Başarı</h2>${rowsC(L.byVolatility)}</div>
 </div>
 <div class="grid">
  <div class="card"><h2>Market Regime Bazlı Başarı</h2>${rowsC(L.byRegime)}</div>
  <div class="card"><h2>Open Interest Verisi</h2>
   <div class="row"><span class="k">Veri olan kayıt</span><span class="v">${L.oiPresence.withData}</span></div>
   <div class="row"><span class="k">Veri olmayan</span><span class="v">${L.oiPresence.withoutData}</span></div>
   <p class="note">${L.oiPresence.note}</p>
  </div>
 </div>
 <div class="grid">
  <div class="card"><h2>Düşük Risk + 90+ Confidence</h2>
   <div class="row"><span class="k">Örnek</span><span class="v">${L.combo.total}</span></div>
   <div class="row"><span class="k">Başarı</span><span class="v ${L.combo.insufficient?'':cls(L.combo.rate)}">${L.combo.insufficient?'<span class="warn">Yetersiz Veri</span>':(L.combo.rate==null?'—':L.combo.rate+'%')}</span></div>
  </div>
  <div class="card"><h2>📊 AI Learning Report (Telegram için hazır)</h2>
   <div class="row"><span class="k">En iyi yapı</span><span class="v">${rep(lr.enIyiYapi)}</span></div>
   <div class="row"><span class="k">En iyi volatilite</span><span class="v">${rep(lr.enIyiVolatilite)}</span></div>
   <div class="row"><span class="k">En iyi rejim</span><span class="v">${rep(lr.enIyiRejim)}</span></div>
   <div class="row"><span class="k">En iyi funding</span><span class="v">${rep(lr.enIyiFunding)}</span></div>
   <div class="row"><span class="k">En iyi long/short</span><span class="v">${rep(lr.enIyiLongShort)}</span></div>
   <div class="row"><span class="k">En iyi coin</span><span class="v">${rep(lr.enIyiCoin)}</span></div>
   <p class="note">${lr.ready?'Rapor verisi hazır (Telegram gönderimi sonraki faz).':'Yeterli veri birikince hazır olacak.'}</p>
  </div>
  <div class="card"><h2>Timeline Entegrasyonu</h2><p class="note">${d.timeline.note}</p></div>
 </div>`;
}).catch(e=>{document.getElementById('app').innerHTML='<p class="bad">Bağlantı hatası: '+e.message+'</p>';});
</script>
<script src="shared/i18n/i18n.js"></script><script src="shared/nav/nav.js"></script></body></html>
