<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VD SecuriAnalyst — Elite Intelligence Center</title>
<link rel="stylesheet" href="shared/nav/nav.css">
<style>
:root{--bg:#0a0e17;--card:#111722;--bd:#1e2836;--tx:#e6edf6;--mut:#8b98ac;--ac:#3b9eff;--ok:#36d399;--bad:#f87272;--warn:#fbbd23;--elite:#b39dfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h2{font-size:13px;color:var(--mut);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.full{grid-column:1/-1}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.k{color:var(--mut)}.v{font-weight:600}
.big{font-size:30px;font-weight:700;color:var(--elite)}
.bar{height:8px;background:#1a2330;border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--elite))}
.status{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(157,125,250,.15);color:var(--elite);border:1px solid rgba(157,125,250,.4)}
.elite-list{list-style:none;padding:0;margin:8px 0 0}.elite-list li{padding:6px 0;font-size:14px;color:var(--tx)}.elite-list li .lk{color:var(--elite)}
.lock{text-align:center;border:1px solid rgba(157,125,250,.4);background:rgba(157,125,250,.06);border-radius:14px;padding:22px 16px;margin-top:6px}
.lock .ic{font-size:30px}.lock .ttl{font-size:16px;font-weight:700;margin:8px 0 4px}.lock .tx{color:var(--mut);font-size:13px;margin-bottom:14px}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--elite));color:#04101f}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.scaffold .card{border-left:3px solid var(--elite)}
.collecting{color:var(--mut);font-size:13px;font-style:italic}
.disc{color:var(--mut);font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:16px;border-left:3px solid var(--warn)}
</style></head><body>
<header class="aic-header">
  <a href="index.html" class="aic-logo">◈ VD <b>SecuriAnalyst</b></a>
  <nav class="aic-nav"><a href="index.html">Ana Sayfa</a><a href="index.html" class="aic-home-btn">Ana Panele Dön</a></nav>
</header>
<h1>🧠 Elite Intelligence Center</h1>
<p class="sub">Arşiv ve AI Learning verilerinden türetilen üst düzey piyasa zekâsı katmanı. <span id="gen"></span></p>
<div class="disc">⚠️ Buradaki içerikler geçmiş sonuçlardan türetilmiş istatistiksel gözlemlerdir; yatırım tavsiyesi değildir.</div>
<div id="app"><p class="sub">Yükleniyor…</p></div>

<script src="modules/access-levels.js"></script>
<script>
(function(){
  const TARGET = 50; // Elite aktivasyon hedefi (validated + partial)
  const app = document.getElementById('app');

  function level(){ try { return (window.VDAccess && window.VDAccess.level) ? window.VDAccess.level() : 'free'; } catch(e){ return 'free'; } }
  function isElite(){ try { return !!(window.VDAccess && window.VDAccess.isElite && window.VDAccess.isElite()); } catch(e){ return false; } }

  // FREE → erişim yok
  function renderFree(){
    app.innerHTML = `
      <div class="lock">
        <div class="ic">🔒</div>
        <div class="ttl">Intelligence Center — Premium Erişim Gerekli</div>
        <div class="tx">Bu bölüm Premium ve Elite üyelere açıktır.</div>
        <a class="btn" href="premium.html">Premium'a Göz At →</a>
      </div>`;
  }

  // PREMIUM → placeholder (kilitli, merak uyandırır)
  function renderPremium(count){
    const rate = Math.min(100, Math.round((count / TARGET) * 100));
    app.innerHTML = `
      <div class="grid">
        <div class="card full">
          <h2>Elite Engine Status</h2>
          <span class="status">Collecting Market Intelligence</span>
          <div class="row" style="margin-top:12px"><span class="k">Validated Records</span><span class="v">${count} / ${TARGET}</span></div>
          <div class="bar"><i style="width:${rate}%"></i></div>
          <div class="row"><span class="k">Current Learning Rate</span><span class="v">${rate}%</span></div>
          <div class="row"><span class="k">Estimated Activation</span><span class="v">Veri Toplanıyor</span></div>
        </div>
      </div>
      <div class="card full">
        <h2>Elite Intelligence</h2>
        <ul class="elite-list">
          <li><span class="lk">✓</span> Coin Ranking</li>
          <li><span class="lk">✓</span> Structure Ranking</li>
          <li><span class="lk">✓</span> Market Conditions</li>
          <li><span class="lk">✓</span> Opportunity Matrix</li>
          <li><span class="lk">✓</span> Weekly Elite Reports</li>
        </ul>
      </div>
      <div class="lock">
        <div class="ic">🔒</div>
        <div class="ttl">Elite Access Required</div>
        <div class="tx">AI Learning sistemi yeterli doğrulanmış veri topladığında ve Elite erişimin olduğunda bu katman açılır.</div>
        <a class="btn" href="premium.html">Elite Pass Hakkında →</a>
      </div>`;
  }

  // ELITE / ADMIN → erişim açık, bölüm iskeleti (hesaplama motoru sonraki fazda)
  function renderElite(count){
    const rate = Math.min(100, Math.round((count / TARGET) * 100));
    const active = count >= TARGET;
    const card = (title) => `<div class="card"><h2>${title}</h2><p class="collecting">${active ? 'Hazırlanıyor…' : 'Veri Toplanıyor — yeterli doğrulanmış veri birikince aktifleşecek.'}</p></div>`;
    app.innerHTML = `
      <div class="grid">
        <div class="card full">
          <h2>Elite Engine Status</h2>
          <span class="status" style="background:rgba(54,211,153,.12);color:var(--ok);border-color:rgba(54,211,153,.4)">Elite Access · Aktif</span>
          <div class="row" style="margin-top:12px"><span class="k">Validated Records</span><span class="v">${count} / ${TARGET}</span></div>
          <div class="bar"><i style="width:${rate}%"></i></div>
          <div class="row"><span class="k">Learning Rate</span><span class="v">${rate}%</span></div>
          <div class="row"><span class="k">Engine</span><span class="v">${active ? 'Aktif' : 'Collecting Intelligence'}</span></div>
        </div>
      </div>
      <div class="grid scaffold">
        ${card('Elite Coin Ranking')}
        ${card('Elite Structure Ranking')}
        ${card('Elite Market Conditions')}
        ${card('Elite Volatility Intelligence')}
        ${card('Elite Regime Intelligence')}
        ${card('Elite Opportunity Matrix')}
      </div>
      <div class="card full scaffold"><h2>AI Intelligence Reports</h2><p class="collecting">${active ? 'Hazırlanıyor…' : 'Veri Toplanıyor — Elite raporları yeterli veri birikince üretilecek.'}</p></div>
      <p class="note">Elite hesaplama motoru bir sonraki fazda devreye alınacaktır. Şu an gerçek sayım gösterilir; uydurma veri üretilmez.</p>`;
  }

  function boot(){
    const lvl = level();
    if (lvl === 'free') { renderFree(); return; }
    const elite = isElite();
    // validated + partial sayısını archive-stats'tan al
    fetch('/api/archive-stats').then(r=>r.json()).then(d=>{
      let count = 0;
      try { if (d && d.ok && d.overall) count = (d.overall.success||0) + (d.overall.partial||0); } catch(e){}
      try { document.getElementById('gen').textContent = '· ' + new Date(d.generated_at||Date.now()).toLocaleString('tr-TR'); } catch(e){}
      if (elite) renderElite(count); else renderPremium(count);
    }).catch(()=>{ if (elite) renderElite(0); else renderPremium(0); });
  }

  // VDAccess hazır olana kadar minik bekleme (script sırası güvencesi)
  let tries=0;
  (function wait(){ if (window.VDAccess || tries++>20) return boot(); setTimeout(wait,80); })();
})();
</script>
<script src="shared/nav/nav.js"></script>
</body></html>
