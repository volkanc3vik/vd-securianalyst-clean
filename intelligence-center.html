<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VD SecuriAnalyst — Elite Intelligence Center</title>
<link rel="stylesheet" href="shared/nav/nav.css">
<style>
:root{--bg:#0a0e17;--card:#111722;--bd:#1e2836;--tx:#e6edf6;--mut:#8b98ac;--ac:#3b9eff;--ok:#36d399;--bad:#f87272;--warn:#fbbd23;--elite:#b39dfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h2{font-size:13px;color:var(--mut);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.full{grid-column:1/-1}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.k{color:var(--mut)}.v{font-weight:600}
.bar{position:relative;height:20px;background:#1a2330;border-radius:7px;overflow:hidden;margin:12px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--elite))}
.barlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px}
.badge-lg{font-size:13px;padding:8px 18px}
.badge-req{background:rgba(251,189,35,.14);color:var(--warn);border:1px solid rgba(251,189,35,.5)}
.badge-active{background:rgba(54,211,153,.12);color:var(--ok);border:1px solid rgba(54,211,153,.45)}
.badge-admin{background:rgba(157,125,250,.15);color:var(--elite);border:1px solid rgba(157,125,250,.45)}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--elite));color:#04101f}
.btn-sm{padding:7px 14px;font-size:13px}
.reqbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(251,189,35,.06);border:1px solid rgba(251,189,35,.35);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.reqbar .btn{background:linear-gradient(90deg,var(--warn),var(--elite));margin-left:auto}
.sell{background:#0e1622;border:1px solid var(--bd);border-left:3px solid var(--elite);border-radius:12px;padding:16px 18px;margin-bottom:16px;font-size:14px;line-height:1.6}
.sell b{color:var(--elite)}.sell ul{margin:10px 0 0;padding-left:18px}.sell li{margin:4px 0}
.lockcard .card{border-left:3px solid rgba(157,125,250,.5)}
.collecting{color:var(--mut);font-size:13px;font-style:italic;margin:0}
.cstat{margin-top:10px;font-size:11px;color:var(--mut);border-top:1px solid var(--bd);padding-top:8px}.cstat span{color:var(--ok);font-weight:600}
.flagship{border:1px solid rgba(157,125,250,.5);background:linear-gradient(180deg,rgba(157,125,250,.08),transparent);border-radius:16px;padding:24px;margin-bottom:16px}
.flagship h2{font-size:15px;color:var(--elite);margin:0 0 6px}.flagship .fd{color:var(--mut);font-size:14px;margin:0}.flagship .ftag{display:inline-block;font-size:10px;color:var(--elite);border:1px solid rgba(157,125,250,.4);border-radius:6px;padding:2px 8px;margin-top:12px}
.cta{text-align:center;border:1px solid rgba(157,125,250,.4);background:rgba(157,125,250,.06);border-radius:14px;padding:20px 16px;margin-top:6px}
.cta .ttl{font-size:16px;font-weight:700;margin:6px 0 4px;color:var(--elite)}.cta .tx{color:var(--mut);font-size:13px;margin-bottom:14px}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.disc{color:var(--mut);font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:16px;border-left:3px solid var(--warn)}
</style></head><body>
<header class="aic-header">
  <a href="index.html" class="aic-logo">◈ VD <b>SecuriAnalyst</b></a>
  <nav class="aic-nav"><a href="index.html">Ana Sayfa</a><a href="index.html" class="aic-home-btn">Ana Panele Dön</a></nav>
</header>
<h1>🧠 Elite Intelligence Center</h1>
<p class="sub">Arşiv ve AI Learning verilerinden türetilen üst düzey piyasa zekâsı katmanı. <span id="gen"></span></p>
<div class="disc">⚠️ Buradaki içerikler geçmiş sonuçlardan türetilmiş istatistiksel gözlemlerdir; yatırım tavsiyesi değildir.</div>
<div id="app"><p class="sub">Yükleniyor…</p></div>

<script src="modules/access-levels.js"></script>
<script>
(function(){
  const TARGET = 50;
  const app = document.getElementById('app');
  function level(){ try { return (window.VDAccess && window.VDAccess.level) ? window.VDAccess.level() : 'free'; } catch(e){ return 'free'; } }
  function isElite(){ try { return !!(window.VDAccess && window.VDAccess.isElite && window.VDAccess.isElite()); } catch(e){ return false; } }

  function accessBadge(lvl){
    if (lvl === 'admin') return '<span class="badge badge-admin">🛡 Elite Admin Access</span>';
    if (lvl === 'elite') return '<span class="badge badge-active">🟢 Elite Access Active</span>';
    return '<span class="badge badge-req">🔒 Elite Access Required</span>';
  }

  function progressBox(lvl, count){
    const rate = Math.min(100, Math.round((count / TARGET) * 100));
    const status = count >= TARGET ? 'Active' : 'Collecting Market Intelligence';
    return `
      <div class="card full">
        <h2>Elite Activation Progress</h2>
        ${accessBadge(lvl)}
        <div class="row" style="margin-top:14px"><span class="k">Validated Records</span><span class="v">${count} / ${TARGET}</span></div>
        <div class="bar"><i style="width:${rate}%"></i><span class="barlabel">${count} / ${TARGET} Outcomes</span></div>
        <div class="row"><span class="k">Learning Progress</span><span class="v">${rate}%</span></div>
        <div class="row"><span class="k">Activation Threshold</span><span class="v">50 Validated Outcomes</span></div>
        <div class="row"><span class="k">Status</span><span class="v">${status}</span></div>
      </div>`;
  }

  const FEATURES = [
    '🔒 Elite Coin Ranking','🔒 Elite Structure Ranking','🔒 Elite Market Conditions',
    '🔒 Elite Volatility Intelligence','🔒 Elite Regime Intelligence','🔒 Elite Opportunity Matrix',
  ];
  function featureCards(msg){
    return `<div class="grid lockcard">` + FEATURES.map(t =>
      `<div class="card"><h2>${t}</h2><p class="collecting">${msg}</p><div class="cstat">Status: <span>Collecting Data</span></div></div>`
    ).join('') + `</div>`;
  }
  function flagshipReports(msg){
    return `<div class="flagship">
      <h2>🔒 AI Intelligence Reports</h2>
      <p class="fd">${msg}</p>
      <span class="ftag">Elite'in en güçlü bölümü — yakında</span>
      <div class="cstat" style="margin-top:14px">Status: <span>Collecting Data</span></div>
    </div>`;
  }

  function renderFree(){
    app.innerHTML = `
      <div class="cta">
        <div style="font-size:30px">🔒</div>
        <div class="ttl">Premium Erişim Gerekli</div>
        <div class="tx">Elite Intelligence Center, Premium ve Elite üyelere açıktır.</div>
        <a class="btn" href="premium.html">Premium'a Göz At →</a>
      </div>`;
  }

  function renderPremium(count){
    const msg = 'Market Intelligence data is being collected. Elite metrics will activate after sufficient validated outcomes.';
    app.innerHTML =
      `<div class="reqbar"><span class="badge badge-req badge-lg">🔒 Elite Access Required</span><a class="btn btn-sm" href="premium.html">Elite Pass Al →</a></div>` +
      `<div class="grid">${progressBox('premium', count)}</div>` +
      `<div class="sell">
        <b>Elite Intelligence Layer</b>, AI Learning ve Archive sonuçları yeterli veri seviyesine ulaştığında aktifleşen üst düzey analiz katmanıdır.
        <br><br><b>Elite Pass</b> ile şunlar açılır:
        <ul><li>En güçlü coin sıralamaları</li><li>En başarılı yapı kombinasyonları</li><li>Market koşulu istihbaratı</li><li>Opportunity Matrix</li><li>Elite AI Reports</li></ul>
      </div>` +
      featureCards(msg) +
      flagshipReports(msg) +
      `<p class="note">Elite Intelligence Engine is currently learning from validated outcomes.</p>`;
  }

  function renderElite(lvl, count){
    const msg = 'Market Intelligence data is being collected. Elite metrics will activate after sufficient validated outcomes.';
    app.innerHTML =
      `<div class="grid">${progressBox(lvl, count)}</div>` +
      featureCards(msg) +
      flagshipReports(msg) +
      `<p class="note">Elite Intelligence Engine is currently learning from validated outcomes.</p>`;
  }

  function boot(){
    const lvl = level();
    if (lvl === 'free') { renderFree(); return; }
    const elite = isElite();
    fetch('/api/archive-stats').then(r=>r.json()).then(d=>{
      let count = 0;
      try { if (d && d.ok && d.overall) count = (d.overall.success||0) + (d.overall.partial||0); } catch(e){}
      try { document.getElementById('gen').textContent = '· ' + new Date(d.generated_at||Date.now()).toLocaleString('tr-TR'); } catch(e){}
      if (elite) renderElite(lvl, count); else renderPremium(count);
    }).catch(()=>{ if (elite) renderElite(lvl, 0); else renderPremium(0); });
  }
  let tries=0;
  (function wait(){ if (window.VDAccess || tries++>20) return boot(); setTimeout(wait,80); })();
})();
</script>
<script src="shared/nav/nav.js"></script>
</body></html>
